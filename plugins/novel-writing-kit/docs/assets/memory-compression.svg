<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Memory and context compression</title>
  <desc id="desc">Long-form chapters are distilled into durable project memory while source chapters remain intact.</desc>
  <rect width="1600" height="800" fill="#ffffff"/>
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#17212b">Memory and Context Compression</text>
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="22" fill="#566575">Keep the source intact; compress only what the next decision needs</text>
  <g font-family="Arial, sans-serif">
    <g font-size="20" font-weight="700" fill="#17212b">
      <rect x="100" y="240" width="300" height="380" rx="12" fill="#f7f9fb" stroke="#b7c3cf" stroke-width="3"/>
      <text x="250" y="285" text-anchor="middle">SOURCE MATERIAL</text>
      <g fill="#d9e2ea"><rect x="145" y="330" width="210" height="42" rx="6"/><rect x="145" y="390" width="210" height="42" rx="6"/><rect x="145" y="450" width="210" height="42" rx="6"/><rect x="145" y="510" width="210" height="42" rx="6"/></g>
      <text x="250" y="355" text-anchor="middle" font-size="16" fill="#566575">chapters</text><text x="250" y="415" text-anchor="middle" font-size="16" fill="#566575">notes</text><text x="250" y="475" text-anchor="middle" font-size="16" fill="#566575">settings</text><text x="250" y="535" text-anchor="middle" font-size="16" fill="#566575">research</text>
    </g>
    <g stroke="#9cabb8" stroke-width="4" fill="none"><path d="M400 430 H610"/><path d="M990 430 H1200"/></g>
    <g fill="#9cabb8"><path d="M600 420 l16 10 -16 10z"/><path d="M1190 420 l16 10 -16 10z"/></g>
    <rect x="610" y="270" width="380" height="320" rx="12" fill="#2f8f83"/>
    <text x="800" y="340" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">DISTILL + INDEX</text>
    <g font-size="19" fill="#fff"><text x="690" y="400">• durable facts</text><text x="690" y="440">• current state</text><text x="690" y="480">• timeline + resources</text><text x="690" y="520">• hooks + open questions</text></g>
    <rect x="1200" y="240" width="300" height="380" rx="12" fill="#17212b"/>
    <text x="1350" y="285" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">NEXT SESSION</text>
    <g fill="#d9e2ea"><rect x="1245" y="330" width="210" height="42" rx="6"/><rect x="1245" y="390" width="210" height="42" rx="6"/><rect x="1245" y="450" width="210" height="42" rx="6"/><rect x="1245" y="510" width="210" height="42" rx="6"/></g>
    <text x="1350" y="355" text-anchor="middle" font-size="16" fill="#566575">state card</text><text x="1350" y="415" text-anchor="middle" font-size="16" fill="#566575">memory index</text><text x="1350" y="475" text-anchor="middle" font-size="16" fill="#566575">recent window</text><text x="1350" y="535" text-anchor="middle" font-size="16" fill="#566575">chapter summaries</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Quality control triangle</title>
  <desc id="desc">A manuscript is checked for continuity, prose quality, and factual credibility.</desc>
  <rect width="1400" height="850" fill="#f7f9fb"/>
  <text x="80" y="95" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#17212b">Quality Control Triangle</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="22" fill="#566575">Three complementary checks protect the finished chapter</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <path d="M700 220 L1090 650 L310 650 Z" fill="#ffffff" stroke="#b7c3cf" stroke-width="4"/>
    <circle cx="700" cy="490" r="125" fill="#17212b"/><text x="700" y="480" font-size="26" font-weight="700" fill="#fff">MANUSCRIPT</text><text x="700" y="515" font-size="17" fill="#d9e2ea">ready for review</text>
    <g><circle cx="700" cy="210" r="80" fill="#3a6ea5"/><text x="700" y="205" font-size="20" font-weight="700" fill="#fff">CONTINUITY</text><text x="700" y="235" font-size="15" fill="#fff">characters + timeline</text></g>
    <g><circle cx="1080" cy="665" r="80" fill="#2f8f83"/><text x="1080" y="660" font-size="20" font-weight="700" fill="#fff">PROSE</text><text x="1080" y="690" font-size="15" fill="#fff">voice + rhythm</text></g>
    <g><circle cx="320" cy="665" r="80" fill="#d49a3a"/><text x="320" y="660" font-size="20" font-weight="700" fill="#fff">FACTS</text><text x="320" y="690" font-size="15" fill="#fff">research + credibility</text></g>
  </g>
</svg>

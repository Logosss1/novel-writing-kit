<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Chapter production loop</title>
  <desc id="desc">A six-stage pipeline from context loading to memory update.</desc>
  <rect width="1600" height="700" fill="#ffffff"/>
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#17212b">Chapter Production Loop</text>
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="22" fill="#566575">From project context to a checked, reusable chapter</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="20" font-weight="700" fill="#ffffff">
      <rect x="80" y="280" width="210" height="120" rx="10" fill="#566575"/><text x="185" y="332">01  CONTEXT</text><text x="185" y="365" font-size="16" font-weight="400">load state</text>
      <rect x="330" y="280" width="210" height="120" rx="10" fill="#d4553d"/><text x="435" y="332">02  DRAFT</text><text x="435" y="365" font-size="16" font-weight="400">write the scene</text>
      <rect x="580" y="280" width="210" height="120" rx="10" fill="#d49a3a"/><text x="685" y="332">03  RESEARCH</text><text x="685" y="365" font-size="16" font-weight="400">only when needed</text>
      <rect x="830" y="280" width="210" height="120" rx="10" fill="#2f8f83"/><text x="935" y="332">04  EDIT</text><text x="935" y="365" font-size="16" font-weight="400">refine prose</text>
      <rect x="1080" y="280" width="210" height="120" rx="10" fill="#2f8f83"/><text x="1185" y="332">05  CHECK</text><text x="1185" y="365" font-size="16" font-weight="400">audit continuity</text>
      <rect x="1330" y="280" width="210" height="120" rx="10" fill="#17212b"/><text x="1435" y="332">06  MEMORY</text><text x="1435" y="365" font-size="16" font-weight="400">update state</text>
    </g>
    <g stroke="#9cabb8" stroke-width="4" fill="none">
      <path d="M290 340 H330"/><path d="M540 340 H580"/><path d="M790 340 H830"/><path d="M1040 340 H1080"/><path d="M1290 340 H1330"/>
    </g>
    <g fill="#9cabb8"><path d="M322 330 l16 10 -16 10z"/><path d="M572 330 l16 10 -16 10z"/><path d="M822 330 l16 10 -16 10z"/><path d="M1072 330 l16 10 -16 10z"/><path d="M1322 330 l16 10 -16 10z"/></g>
  </g>
</svg>

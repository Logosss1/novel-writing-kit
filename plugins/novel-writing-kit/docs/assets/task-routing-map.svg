<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Task routing map</title>
  <desc id="desc">Focused requests use one skill; complex chapter requests use a routed sequence.</desc>
  <rect width="1600" height="850" fill="#f7f9fb"/>
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#17212b">Task Routing Map</text>
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="22" fill="#566575">Choose the smallest workflow that can complete the request</text>
  <g font-family="Arial, sans-serif">
    <g font-size="22" font-weight="700" fill="#17212b">
      <rect x="90" y="220" width="360" height="90" rx="10" fill="#fff" stroke="#b7c3cf" stroke-width="3"/><text x="270" y="275" text-anchor="middle">Initialize a novel</text>
      <rect x="90" y="345" width="360" height="90" rx="10" fill="#fff" stroke="#b7c3cf" stroke-width="3"/><text x="270" y="400" text-anchor="middle">Plan an outline</text>
      <rect x="90" y="470" width="360" height="90" rx="10" fill="#fff" stroke="#b7c3cf" stroke-width="3"/><text x="270" y="525" text-anchor="middle">Polish a paragraph</text>
      <rect x="90" y="595" width="360" height="90" rx="10" fill="#fff" stroke="#b7c3cf" stroke-width="3"/><text x="270" y="650" text-anchor="middle">Write and check a chapter</text>
    </g>
    <rect x="590" y="340" width="330" height="170" rx="12" fill="#d4553d"/>
    <text x="755" y="415" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">ROUTER</text>
    <text x="755" y="455" text-anchor="middle" font-size="18" fill="#fff">classify intent + scope</text>
    <g stroke="#9cabb8" stroke-width="4" fill="none">
      <path d="M450 265 H590"/><path d="M450 390 H590"/><path d="M450 515 H590"/><path d="M450 640 H590"/>
      <path d="M920 425 H1040"/>
    </g>
    <g fill="#9cabb8"><path d="M580 255 l16 10 -16 10z"/><path d="M580 380 l16 10 -16 10z"/><path d="M580 505 l16 10 -16 10z"/><path d="M580 630 l16 10 -16 10z"/><path d="M1030 415 l16 10 -16 10z"/></g>
    <g font-size="20" font-weight="700" fill="#fff" text-anchor="middle">
      <rect x="1040" y="205" width="390" height="80" rx="10" fill="#3a6ea5"/><text x="1235" y="255">ARCHITECT</text>
      <rect x="1040" y="315" width="390" height="80" rx="10" fill="#3a6ea5"/><text x="1235" y="365">OUTLINE</text>
      <rect x="1040" y="425" width="390" height="80" rx="10" fill="#d4553d"/><text x="1235" y="475">DRAFT → EDIT → CHECK</text>
      <rect x="1040" y="535" width="390" height="80" rx="10" fill="#d49a3a"/><text x="1235" y="585">RESEARCH (ON DEMAND)</text>
      <rect x="1040" y="645" width="390" height="80" rx="10" fill="#566575"/><text x="1235" y="695">MEMORY (WHEN STATE CHANGES)</text>
    </g>
  </g>
</svg>
